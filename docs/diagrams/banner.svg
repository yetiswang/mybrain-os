<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mybrain os — a personal operating system for a knowledge worker">
  <!-- Background: warm paper canvas -->
  <rect width="1280" height="320" fill="#FAF6F0"/>

  <!-- Top accent rule -->
  <rect x="0" y="0" width="1280" height="6" fill="#C8102E"/>

  <!-- Bottom hairline -->
  <line x1="80" y1="296" x2="1200" y2="296" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Typography column (left) -->
  <g transform="translate(80, 130)">
    <!-- Wordmark -->
    <text font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="92" font-weight="700" fill="#111111" letter-spacing="-2.5">
      mybrain<tspan fill="#C8102E">·</tspan>os
    </text>

    <!-- Tagline -->
    <text y="44" font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="400" fill="#4B5563">
      a personal operating system for a knowledge worker
    </text>

    <!-- Stack caps -->
    <text y="88" font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#9CA3AF" letter-spacing="2.4">
      OBSIDIAN · CLAUDE CODE · CODEX · HERMES · MCP · macOS
    </text>
  </g>

  <!-- Architecture motif (right) -->
  <g transform="translate(1000, 160)">
    <!-- Connecting lines from agents to vault -->
    <line x1="0" y1="0" x2="-104" y2="-74" stroke="#C8102E" stroke-width="1.5" opacity="0.55"/>
    <line x1="0" y1="0" x2="-118" y2="6" stroke="#C8102E" stroke-width="1.5" opacity="0.55"/>
    <line x1="0" y1="0" x2="-104" y2="86" stroke="#C8102E" stroke-width="1.5" opacity="0.55"/>

    <!-- Vault circle (centre) -->
    <circle cx="0" cy="0" r="50" fill="#FAF6F0" stroke="#2D8B8B" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="16" font-weight="600" fill="#2D8B8B">vault</text>

    <!-- Agent nodes + labels (right-aligned) -->
    <g font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
       font-size="14" font-weight="500" fill="#111111" text-anchor="end">

      <circle cx="-104" cy="-74" r="6" fill="#111111"/>
      <text x="-118" y="-69">Claude Code</text>

      <circle cx="-118" cy="6" r="6" fill="#111111"/>
      <text x="-132" y="11">Codex CLI</text>

      <circle cx="-104" cy="86" r="6" fill="#111111"/>
      <text x="-118" y="91">Hermes</text>
    </g>

    <!-- MCP layer hint (under vault) -->
    <text x="0" y="86"
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="500" fill="#9CA3AF" letter-spacing="2">
      VIA MCP
    </text>
  </g>
</svg>
